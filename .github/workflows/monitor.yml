name: 精銳哨兵監控

on:
  workflow_dispatch:
    inputs:
      market:
        description: '市場選擇'
        required: true
        type: choice
        options:
          - HK
          - US
        default: 'HK'

concurrency:
  group: elite-sentinel-${{ github.event.inputs.market }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Elite Sentinel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MARKET: ${{ github.event.inputs.market }}
        run: python stock_monitor.py

      - name: Commit index and offset
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add current_index_hk.txt current_index_us.txt last_update_id.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "update index and offset" && git push)
