name: 精銳哨兵監控

on:
  schedule:
    - cron: '0,15,30,45 0-9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: elite-sentinel
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 必须提供 token 才能推送

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Elite Sentinel
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python stock_monitor.py

      - name: Commit last_update_id
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add last_update_id.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "update telegram offset" && git push)
