name: 精銳哨兵監控

on:
  schedule:
    # 1. 對應 HKT 08:30（只有這一筆）
    - cron: '30 0 * * 1-5'

    # 2. 對應 HKT 09:00 ~ 16:30（每小時的 0 分和 30 分）
    - cron: '0,30 1-8 * * 1-5'

    # 3. 對應 HKT 17:00 和 17:30（9:00 和 9:30 UTC）
    - cron: '0,30 9 * * 1-5'

  workflow_dispatch:   # 保留手動觸發

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute Elite Sentinel
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python stock_monitor.py
